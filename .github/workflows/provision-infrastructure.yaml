name: Provision Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - 'dev'
          - 'production'

jobs:

  terraform_apply:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./main/env/${{ github.event.inputs.environment }}/

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
  
      - name: Gcloud Setup
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.PROJECT_ID }}

      - name: Download .tfvars file
        run: |
          if [[ ${{ github.event.inputs.environment }} == "dev" ]]; then
            gsutil cp ${{ secrets.DEV_TF_VARS }} ./terraform.tfvars
          elif [[ ${{ github.event.inputs.environment }} == "production" ]]
            gsutil cp ${{ secrets.PRODUCTION_TF_VARS }} ./terraform.tfvars
          fi
          

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply --auto-approve
